[package]
name = "oplire"
version = "0.4.0"
edition = "2021"
description = "A small API bridge and OpenCode health-check launcher"
authors = ["martinf08", "Berke Oruc (adapted components)"]
license = "MIT"
repository = "https://github.com/martinf08/oplire"

[dependencies]
anyhow = "1.0"
async-stream = "0.3"
axum = { version = "0.7", features = ["json"] }
bytes = "1.0"
clap = { version = "4.5", features = ["derive", "env"] }
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls", "socks"] }
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
percent-encoding = "2.3"
rusqlite = { version = "0.41", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tokio = { version = "1.0", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2.5"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
tempfile = "3.20"

[profile.release]
strip = true
lto = true
codegen-units = 1
