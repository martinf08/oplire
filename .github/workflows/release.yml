name: Release binaries

on:
  push:
    tags:
      - "v*"
  pull_request:
    paths:
      - '.github/workflows/release.yml'
      - 'Cargo.*'
      - 'src/**'
      - 'tests/**'
      - 'systemd/**'
      - 'README.md'
      - 'CONTRIBUTING.md'
      - 'SECURITY.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            platform: linux
            suffix: ""
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            platform: linux
            suffix: ""
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            platform: macos
            suffix: ""
          - runner: macos-15
            target: aarch64-apple-darwin
            platform: macos
            suffix: ""
          - runner: windows-2025
            target: x86_64-pc-windows-msvc
            platform: windows
            suffix: ".exe"
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      PACKAGE_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || 'snapshot' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          target: ${{ matrix.target }}
      - name: Run target tests
        run: cargo test --all-targets --locked
      - name: Build executables
        run: cargo build --release --bins --locked --target ${{ matrix.target }}
      - name: Package Unix release
        if: runner.os != 'Windows'
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          PLATFORM: ${{ matrix.platform }}
          SUFFIX: ${{ matrix.suffix }}
        run: |
          set -euo pipefail
          name="oplire-${PACKAGE_VERSION}-${TARGET}"
          stage="dist/${name}"
          mkdir -p "${stage}/bin"
          for binary in oplire proxy-rotate proxy-hunt reset-opencode reset-opencode-default; do
            cp "target/${TARGET}/release/${binary}${SUFFIX}" "${stage}/bin/"
            cp "target/${TARGET}/release/${binary}${SUFFIX}" "dist/${binary}-${TARGET}${SUFFIX}"
          done
          cp README.md LICENSE CONTRIBUTING.md SECURITY.md "${stage}/"
          if [ "${PLATFORM}" = linux ]; then
            mkdir -p "${stage}/systemd"
            cp systemd/proxy-rotate.service "${stage}/systemd/"
          fi
          tar -C dist -czf "dist/${name}.tar.gz" "${name}"
          rm -r -- "${stage}"
      - name: Package Windows release
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          TARGET: ${{ matrix.target }}
          SUFFIX: ${{ matrix.suffix }}
        run: |
          $ErrorActionPreference = 'Stop'
          $name = "oplire-$env:PACKAGE_VERSION-$env:TARGET"
          $stage = Join-Path 'dist' $name
          $bin = Join-Path $stage 'bin'
          New-Item -ItemType Directory -Path $bin -Force | Out-Null
          foreach ($binary in @('oplire', 'proxy-rotate', 'proxy-hunt', 'reset-opencode', 'reset-opencode-default')) {
            $source = "target/$env:TARGET/release/$binary$env:SUFFIX"
            Copy-Item $source $bin
            Copy-Item $source (Join-Path 'dist' "$binary-$env:TARGET$env:SUFFIX")
          }
          Copy-Item README.md, LICENSE, CONTRIBUTING.md, SECURITY.md $stage
          $archive = "$stage.zip"
          Compress-Archive -Path "$stage/*" -DestinationPath $archive
          Remove-Item -LiteralPath $stage -Recurse -Force
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub Release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true
      - name: Create checksums and publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          cd release-assets
          find . -maxdepth 1 -type f ! -name SHA256SUMS -printf '%f\n' | sort | xargs sha256sum > SHA256SUMS
          gh release create "$GITHUB_REF_NAME" \
            --verify-tag \
            --generate-notes \
            --title "Oplire $GITHUB_REF_NAME" \
            ./*
